<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>English Safari - Jurassic Explorer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #051005; touch-action: none; user-select: none; -webkit-user-select: none; }
        
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; padding: 10px; color: white; }
        
        .menu-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; pointer-events: all; padding: 20px; text-align: center; }
        
        .btn { 
            pointer-events: all; 
            background: #eab308; 
            color: #1a2f1a; 
            padding: 12px 24px; 
            border-radius: 50px; 
            font-size: 1.2rem; 
            margin: 8px; 
            cursor: pointer; 
            transition: all 0.2s; 
            border: 3px solid #1a2f1a; 
            min-width: 200px; 
            text-align: center; 
            box-shadow: 0 4px 0px #854d0e; 
            font-weight: 900;
            text-transform: uppercase;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 0px 0px #854d0e; }
        
        .progress-box { background: rgba(0,0,0,0.7); padding: 8px 16px; border-radius: 20px; font-size: 1rem; border: 2px solid #eab308; pointer-events: none; font-weight: bold; align-self: flex-start; color: #eab308; }

        #timer-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: rgba(0,0,0,0.3);
            display: none;
        }
        #timer-bar {
            width: 100%;
            height: 100%;
            background: #ef4444;
            transition: width 0.1s linear;
        }

        #feedback-text {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(3rem, 12vw, 6rem);
            font-weight: 900;
            text-shadow: 4px 4px 0px #000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 50;
            text-align: center;
        }
        
        #end-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 200; color: white; pointer-events: all; padding: 15px; text-align: center; }
        
        .controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            pointer-events: all;
        }
        
        .control-btn { 
            background: #eab308; 
            width: 60px; height: 60px; 
            border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 1.5rem; 
            border: 3px solid #1a2f1a; 
            cursor: pointer; 
        }

        /* Animations pour les étoiles et la coupe */
        .star { font-size: clamp(40px, 10vw, 80px); color: #ffd700; text-shadow: 0 0 20px gold; display: inline-block; animation: pop 0.5s ease-out forwards; opacity: 0; margin: 0 5px; }
        .trophy { font-size: clamp(80px, 15vw, 120px); animation: bounce 1s infinite alternate; }
        @keyframes pop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-20px); } }
        
        #confetti-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 300; display: none; }
    </style>
</head>
<body>

    <canvas id="confetti-canvas"></canvas>

    <div id="menu" class="menu-overlay">
        <h1 class="text-5xl md:text-7xl font-black mb-4 text-yellow-500 uppercase tracking-tighter">JURASSIC SAFARI</h1>
        <p class="mb-10 text-xl md:text-2xl text-green-500 font-bold uppercase">Système de Guidage Vocal</p>
        <button class="btn" onclick="startGame()">LANCER LE TOUR</button>
    </div>

    <div id="end-screen">
        <div id="end-visuals" class="mb-4 h-32 flex items-center justify-center"></div>
        <h2 id="end-title" class="text-5xl font-black mb-4 text-yellow-500">TOUR TERMINÉ</h2>
        <p id="end-score" class="text-2xl mb-8 font-bold"></p>
        <button class="btn" onclick="location.reload()">RECOMMENCER</button>
    </div>

    <div id="ui-layer">
        <div id="timer-container">
            <div id="timer-bar"></div>
        </div>
        
        <div class="absolute top-5 left-5">
            <div class="progress-box" id="progress">ENCLOS 0 / 10</div>
        </div>

        <div id="feedback-text">EXCELLENT!</div>

        <div class="controls">
            <button class="control-btn" onclick="replayInstruction()">🔊</button>
        </div>
    </div>

    <script>
        const animals = [
            { id: 'singe', en: 'monkey' },
            { id: 'autruche', en: 'ostrich' },
            { id: 'perroquet', en: 'parrot' },
            { id: 'chevre', en: 'goat' },
            { id: 'elephant', en: 'elephant' },
            { id: 'girafe', en: 'giraffe' },
            { id: 'antilope', en: 'antelope' },
            { id: 'zebre', en: 'zebra' },
        ];

        let scene, camera, renderer, car, clock;
        let questionCount = 0;
        let correctAnswers = 0;
        let currentTarget = null;
        let activeEnclosures = [];
        let currentEnclosure = null;
        let isPlaying = false;
        let isMoving = false;
        let gameSpeed = 0;
        let targetSpeed = 0;
        let roadTiles = [];
        let scenery = [];
        let lastSpokenText = "";
        let timeLeft = 15;
        const totalTime = 15;
        let timerInterval = null;
        let isAnswered = false;
        
        let confettis = [];
        let confCanvas, confCtx;

        const apiKey = "";
        const textureLoader = new THREE.TextureLoader();
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x051005); 
            scene.fog = new THREE.Fog(0x051005, 30, 120);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(32, 8, 0); 
            camera.lookAt(-5, 3, 0);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);
            
            const sunLight = new THREE.DirectionalLight(0xffffff, 0.9);
            sunLight.position.set(20, 40, 10);
            sunLight.castShadow = true;
            scene.add(sunLight);

            const jungleLight = new THREE.HemisphereLight(0x00ff00, 0x002200, 0.4);
            scene.add(jungleLight);

            createRoad();
            createRealisticJurassicCar();

            for(let i=0; i<80; i++) {
                createRealisticTree(-18 - Math.random()*25, -i * 6 + 120);
                if(i % 2 === 0) createRealisticTree(-30 - Math.random()*25, -i * 6 + 120);
            }

            clock = new THREE.Clock();
            
            confCanvas = document.getElementById('confetti-canvas');
            confCtx = confCanvas.getContext('2d');
            resizeConfetti();

            animate();

            window.addEventListener('mousedown', onSceneClick);
            window.addEventListener('touchstart', (e) => {
                onSceneClick({ clientX: e.touches[0].clientX, clientY: e.touches[0].clientY });
            });
        }

        function createRoad() {
            for(let i=0; i<60; i++) {
                const segment = new THREE.Group();
                const roadGeo = new THREE.BoxGeometry(14, 0.2, 10);
                const roadMat = new THREE.MeshPhongMaterial({ color: 0x1a1a1a });
                const road = new THREE.Mesh(roadGeo, roadMat);
                road.receiveShadow = true;
                segment.add(road);

                const railGeo = new THREE.BoxGeometry(0.5, 0.1, 10);
                const railMat = new THREE.MeshPhongMaterial({ color: 0x666666 });
                const rail = new THREE.Mesh(railGeo, railMat);
                rail.position.y = 0.15;
                segment.add(rail);

                segment.position.z = -i * 10 + 60;
                scene.add(segment);
                roadTiles.push(segment);
            }
        }

        function createRealisticJurassicCar() {
            car = new THREE.Group();
            
            const bodyMat = new THREE.MeshPhongMaterial({ color: 0x2d5a27 }); 
            const yellowMat = new THREE.MeshPhongMaterial({ color: 0xeab308 }); 
            const redMat = new THREE.MeshPhongMaterial({ color: 0x991b1b }); 
            const blackMat = new THREE.MeshPhongMaterial({ color: 0x111111 }); 
            const glassMat = new THREE.MeshPhongMaterial({ color: 0x222222, transparent: true, opacity: 0.8 }); 
            const hubMat = new THREE.MeshPhongMaterial({ color: 0xcc1111 }); 
            
            const baseBody = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.7, 5.4), bodyMat);
            baseBody.position.y = 0.85;
            baseBody.castShadow = true;
            car.add(baseBody);

            const stripe = new THREE.Mesh(new THREE.BoxGeometry(2.45, 0.2, 5.45), yellowMat);
            stripe.position.y = 1.25;
            car.add(stripe);

            const hood = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.3, 1.6), yellowMat);
            hood.position.set(0, 1.35, 1.9);
            hood.rotation.x = 0.08;
            car.add(hood);

            const cabin = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.9, 3.6), redMat);
            cabin.position.set(0, 1.8, -0.4);
            car.add(cabin);

            const windows = new THREE.Mesh(new THREE.BoxGeometry(2.35, 0.6, 3.4), glassMat);
            windows.position.set(0, 1.8, -0.4);
            car.add(windows);

            const windShield = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.9, 0.1), glassMat);
            windShield.position.set(0, 1.65, 1.55);
            windShield.rotation.x = -Math.PI / 3.5;
            car.add(windShield);

            const backGlass = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.8, 0.1), glassMat);
            backGlass.position.set(0, 1.7, -2.2);
            backGlass.rotation.x = Math.PI / 8;
            car.add(backGlass);

            const roofGlass = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.1, 2.2), glassMat);
            roofGlass.position.set(0, 2.26, -0.4);
            car.add(roofGlass);

            const railGeo = new THREE.CylinderGeometry(0.05, 0.05, 3.8, 8);
            [0.9, -0.9].forEach(x => {
                const rail = new THREE.Mesh(railGeo, blackMat);
                rail.rotation.x = Math.PI/2;
                rail.position.set(x, 2.35, -0.4);
                car.add(rail);
                for(let z=-1.5; z<=1.5; z+=1.5) {
                    const support = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.2, 0.1), blackMat);
                    support.position.set(x, 2.25, -0.4 + z);
                    car.add(support);
                }
            });

            const spotGeo = new THREE.CylinderGeometry(0.15, 0.15, 0.2, 16);
            for(let i=-0.6; i<=0.6; i+=0.4) {
                const spot = new THREE.Mesh(spotGeo, blackMat);
                spot.rotation.x = Math.PI/2;
                spot.position.set(i, 2.4, 0.6);
                car.add(spot);
                const lightLens = new THREE.Mesh(new THREE.CircleGeometry(0.12, 16), new THREE.MeshBasicMaterial({color: 0xffffee}));
                lightLens.position.set(i, 2.4, 0.71);
                car.add(lightLens);
            }

            const grill = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.5, 0.1), blackMat);
            grill.position.set(0, 0.85, 2.7);
            car.add(grill);

            const bullbarGeo = new THREE.CylinderGeometry(0.06, 0.06, 2.4, 8);
            const bb1 = new THREE.Mesh(bullbarGeo, blackMat);
            bb1.rotation.z = Math.PI/2;
            bb1.position.set(0, 0.9, 2.9);
            car.add(bb1);
            const bb2 = new THREE.Mesh(bullbarGeo, blackMat);
            bb2.rotation.z = Math.PI/2;
            bb2.position.set(0, 0.6, 2.9);
            car.add(bb2);

            const spareTire = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 0.3, 24), blackMat);
            spareTire.rotation.x = Math.PI/2;
            spareTire.position.set(0, 1.2, -2.85);
            car.add(spareTire);
            
            const wheelGeo = new THREE.CylinderGeometry(0.65, 0.65, 0.6, 24);
            const fenderGeo = new THREE.BoxGeometry(0.8, 0.15, 1.8);
            
            [[1.2, 0.65, 1.7], [-1.2, 0.65, 1.7], [1.2, 0.65, -1.6], [-1.2, 0.65, -1.6]].forEach(pos => {
                const w = new THREE.Group();
                const tire = new THREE.Mesh(wheelGeo, blackMat);
                tire.rotation.z = Math.PI/2;
                w.add(tire);
                
                const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.62, 12), hubMat);
                hub.rotation.z = Math.PI/2;
                w.add(hub);
                
                w.position.set(...pos);
                car.add(w);

                const fender = new THREE.Mesh(fenderGeo, blackMat);
                fender.position.set(pos[0], pos[1] + 0.65, pos[2]);
                car.add(fender);
            });

            car.position.y = 0.2;
            car.rotation.y = Math.PI; 
            scene.add(car);
        }

        function createRealisticTree(x, z) {
            const tree = new THREE.Group();
            const trunkMat = new THREE.MeshPhongMaterial({color: 0x3d2b1f});
            const leavesMat = new THREE.MeshPhongMaterial({color: 0x1e5631, flatShading: true});
            
            const scale = 0.8 + Math.random() * 1.5;
            
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.6, 8, 7), trunkMat);
            trunk.position.y = 4;
            tree.add(trunk);

            const canopyHeights = [6, 7.5, 9];
            const canopyRadii = [3.5, 2.8, 2];
            
            for(let i=0; i<3; i++) {
                const leaves = new THREE.Mesh(new THREE.DodecahedronGeometry(canopyRadii[i], 1), leavesMat);
                leaves.position.y = canopyHeights[i];
                leaves.position.x = (Math.random() - 0.5) * 1.5;
                leaves.position.z = (Math.random() - 0.5) * 1.5;
                leaves.scale.y = 0.8; 
                tree.add(leaves);
            }

            tree.scale.set(scale, scale, scale);
            tree.position.set(x, 0, z);
            tree.rotation.y = Math.random() * Math.PI;
            scene.add(tree);
            scenery.push(tree);
        }

        function spawnEnclosure() {
            currentTarget = animals[Math.floor(Math.random() * animals.length)];
            const others = animals.filter(a => a.id !== currentTarget.id).sort(() => 0.5 - Math.random()).slice(0, 3);
            const choices = [currentTarget, ...others].sort(() => 0.5 - Math.random());
            
            const newEnclosure = new THREE.Group();
            
            const wall = new THREE.Mesh(new THREE.BoxGeometry(1, 12, 30), new THREE.MeshPhongMaterial({ color: 0x222222 }));
            wall.position.set(-15, 6, 0);
            newEnclosure.add(wall);

            [2, 4, 6, 8, 10].forEach(y => {
                const wire = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 30), new THREE.MeshPhongMaterial({color: 0x555555}));
                wire.position.set(-14.4, y, 0);
                newEnclosure.add(wire);
            });

            choices.forEach((choice, i) => {
                const signGroup = new THREE.Group();

                // Cube de fond (Blanc par défaut, change de couleur au clic)
                const bgMat = new THREE.MeshPhongMaterial({ color: 0xffffff });
                const bgBox = new THREE.Mesh(new THREE.BoxGeometry(0.1, 4.2, 4.2), bgMat);
                signGroup.add(bgBox);

                // Image de l'animal transparente posée devant le cube
                const imgMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true });
                textureLoader.load(`${choice.id}.png`, (tex) => {
                    imgMat.map = tex; imgMat.needsUpdate = true;
                }, undefined, () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 512; canvas.height = 512;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,512,512); // Fond de remplacement
                    ctx.strokeStyle = '#000'; ctx.lineWidth = 15; ctx.strokeRect(5,5,502,502);
                    imgMat.map = new THREE.CanvasTexture(canvas); imgMat.needsUpdate = true;
                });

                const imgPlane = new THREE.Mesh(new THREE.PlaneGeometry(4, 4), imgMat);
                imgPlane.position.x = 0.06; // Avancé de justesse pour éviter le clipping
                imgPlane.rotation.y = Math.PI / 2; // Face à la caméra
                signGroup.add(imgPlane);

                signGroup.rotation.y = -0.15; 
                signGroup.position.set(-13, 5, -6.75 + (i * 4.5));
                
                // Liens pour le Raycaster
                signGroup.userData = { id: choice.id, bgMesh: bgBox };
                bgBox.userData = { parentGroup: signGroup };
                imgPlane.userData = { parentGroup: signGroup };
                
                const spot = new THREE.PointLight(0xffffff, 0.6, 12);
                spot.position.set(-10, 5, -6.75 + (i * 4.5));
                newEnclosure.add(spot);
                newEnclosure.add(signGroup);
            });

            newEnclosure.position.z = -180;
            scene.add(newEnclosure);
            activeEnclosures.push(newEnclosure);
            currentEnclosure = newEnclosure;
        }

        function onSceneClick(e) {
            if (!isPlaying || isMoving || isAnswered || !currentEnclosure) return;
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            
            const intersects = raycaster.intersectObjects(currentEnclosure.children, true);
            const clickedPart = intersects.find(intersect => intersect.object.userData && intersect.object.userData.parentGroup);
            if (clickedPart) handleSelection(clickedPart.object.userData.parentGroup);
        }

        function handleSelection(signGroup) {
            isAnswered = true;
            stopTimer();
            const feedbackEl = document.getElementById('feedback-text');
            
            const correctSign = currentEnclosure.children.find(c => c.userData && c.userData.id === currentTarget.id);
            
            if (signGroup.userData.id === currentTarget.id) {
                correctAnswers++;
                feedbackEl.innerText = "EXCELLENT!";
                feedbackEl.style.color = "#4ade80";
                signGroup.userData.bgMesh.material.color.setHex(0x4ade80); // Fond Vert
                speak("Excellent! That is the " + currentTarget.en + ".");
            } else {
                feedbackEl.innerText = "OOPS...";
                feedbackEl.style.color = "#ef4444";
                signGroup.userData.bgMesh.material.color.setHex(0xef4444); // Fond Rouge pour erreur
                if (correctSign) {
                    correctSign.userData.bgMesh.material.color.setHex(0x4ade80); // Fond Vert pour la vraie réponse
                }
                const hitAnimal = animals.find(a => a.id === signGroup.userData.id);
                speak("No, that was the " + hitAnimal.en + ". The " + currentTarget.en + " was there.");
            }
            
            feedbackEl.style.opacity = "1";
            setTimeout(() => { feedbackEl.style.opacity = "0"; }, 2500);
            proceedToNext();
        }

        function startTimer() {
            timeLeft = totalTime;
            isAnswered = false;
            document.getElementById('timer-container').style.display = 'block';
            if(timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft -= 0.1;
                updateTimerBar();
                if (timeLeft <= 0) { clearInterval(timerInterval); if (!isAnswered) handleTimeOut(); }
            }, 100);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            document.getElementById('timer-container').style.display = 'none';
        }

        function updateTimerBar() {
            const percentage = (timeLeft / totalTime) * 100;
            document.getElementById('timer-bar').style.width = `${percentage}%`;
        }

        function handleTimeOut() {
            isAnswered = true;
            document.getElementById('timer-container').style.display = 'none';
            const feedbackEl = document.getElementById('feedback-text');
            feedbackEl.innerText = "TIME OUT!";
            feedbackEl.style.color = "#fbbf24";
            feedbackEl.style.opacity = "1";
            
            if (currentEnclosure) {
                const correctSign = currentEnclosure.children.find(c => c.userData && c.userData.id === currentTarget.id);
                if (correctSign) correctSign.userData.bgMesh.material.color.setHex(0x4ade80);
            }

            setTimeout(() => { feedbackEl.style.opacity = "0"; }, 2500);
            speak(`Time is up! You should have clicked on the ${currentTarget.en}.`);
            proceedToNext();
        }

        function proceedToNext() {
            setTimeout(() => {
                // On ne supprime plus l'enclos ici, il partira vers l'arrière lors du mouvement
                nextTurn();
            }, 3500); 
        }

        async function speak(text) {
            return new Promise(async (resolve) => {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `Safari guide: ${text}` }] }],
                            generationConfig: {
                                responseModalities: ["AUDIO"],
                                speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Puck" } } }
                            }
                        })
                    });
                    const data = await response.json();
                    const audioBase64 = data.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
                    if (audioBase64) playPCM(audioBase64, resolve);
                    else throw new Error();
                } catch (e) {
                    const msg = new SpeechSynthesisUtterance(text);
                    msg.lang = 'en-US';
                    msg.onend = () => resolve();
                    window.speechSynthesis.speak(msg);
                }
            });
        }

        function playPCM(base64, callback) {
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            const wavHeader = new ArrayBuffer(44);
            const view = new DataView(wavHeader);
            const sampleRate = 24000;
            view.setUint32(0, 0x52494646, false); view.setUint32(4, 36 + binary.length, true); view.setUint32(8, 0x57415645, false);
            view.setUint32(12, 0x666d7420, false); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
            view.setUint16(22, 1, true); view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true); view.setUint16(34, 16, true); view.setUint32(36, 0x64617461, false); view.setUint32(40, binary.length, true);
            const blob = new Blob([wavHeader, bytes], { type: 'audio/wav' });
            const audio = new Audio(URL.createObjectURL(blob));
            audio.onended = () => callback();
            audio.play();
        }

        async function nextTurn() {
            if (questionCount >= 10) { endGame(); return; }
            questionCount++;
            document.getElementById('progress').innerText = `ENCLOS ${questionCount} / 10`;
            spawnEnclosure();
            isMoving = true;
            targetSpeed = 1.3; 
        }

        function replayInstruction() { if(lastSpokenText) speak(lastSpokenText); }

        function resizeConfetti() {
            confCanvas.width = window.innerWidth;
            confCanvas.height = window.innerHeight;
        }

        function startFireworks() {
            for(let i=0; i<150; i++) {
                confettis.push({
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * window.innerHeight - window.innerHeight,
                    r: 5 + Math.random() * 8,
                    color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                    vy: 3 + Math.random() * 5,
                    vx: Math.random() * 4 - 2,
                    rotation: Math.random() * Math.PI
                });
            }
        }

        function drawConfetti() {
            if (!confCtx) return;
            confCtx.clearRect(0,0,confCanvas.width, confCanvas.height);
            confettis.forEach((c) => {
                c.y += c.vy;
                c.x += c.vx;
                c.rotation += 0.1;
                if(c.y > confCanvas.height) c.y = -10;
                
                confCtx.save();
                confCtx.translate(c.x, c.y);
                confCtx.rotate(c.rotation);
                confCtx.fillStyle = c.color;
                confCtx.fillRect(-c.r/2, -c.r/2, c.r, c.r);
                confCtx.restore();
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            drawConfetti();

            if (isPlaying) {
                gameSpeed = THREE.MathUtils.lerp(gameSpeed, targetSpeed, 0.05);
                
                roadTiles.forEach(tile => {
                    tile.position.z += gameSpeed;
                    if(tile.position.z > 60) tile.position.z -= 600;
                });
                
                scenery.forEach(item => {
                    item.position.z += gameSpeed;
                    if(item.position.z > 60) item.position.z -= 480;
                });

                // Gestion du défilement des enclos
                activeEnclosures.forEach((enc, index) => {
                    enc.position.z += gameSpeed;
                    // L'enclos part vers l'arrière et est détruit quand il est hors champ
                    if(enc.position.z > 80) {
                        scene.remove(enc);
                        activeEnclosures.splice(index, 1);
                        if(currentEnclosure === enc) currentEnclosure = null;
                    }
                });

                // Arrêt de la voiture face au nouvel enclos
                if (currentEnclosure && isMoving && currentEnclosure.position.z > 0) {
                    isMoving = false;
                    targetSpeed = 0;
                    setTimeout(async () => {
                        lastSpokenText = `Look at the fence. Where is the ${currentTarget.en}? Click the right sign.`;
                        await speak(lastSpokenText);
                        startTimer();
                    }, 500);
                }

                car.position.y = 0.2 + Math.sin(Date.now() * 0.01) * 0.02;
            }
            renderer.render(scene, camera);
        }

        function startGame() {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('end-screen').style.display = 'none';
            document.getElementById('confetti-canvas').style.display = 'none';
            
            activeEnclosures.forEach(enc => scene.remove(enc));
            activeEnclosures = [];
            currentEnclosure = null;
            confettis = [];
            
            isPlaying = true;
            questionCount = 0;
            correctAnswers = 0;
            nextTurn();
        }

        function endGame() {
            isPlaying = false;
            stopTimer();
            document.getElementById('end-screen').style.display = 'flex';
            document.getElementById('end-score').innerText = `SCORE FINAL : ${correctAnswers} / 10`;

            const visual = document.getElementById('end-visuals');
            visual.innerHTML = '';
            
            if (correctAnswers === 10) {
                visual.innerHTML = '<div class="trophy">🏆</div>';
                document.getElementById('confetti-canvas').style.display = 'block';
                startFireworks();
            } else {
                let stars = (correctAnswers >= 8) ? 3 : (correctAnswers >= 4) ? 2 : 1;
                for(let i=0; i<stars; i++) {
                    const s = document.createElement('span');
                    s.className = 'star';
                    s.innerText = '⭐';
                    s.style.animationDelay = `${i * 0.3}s`;
                    visual.appendChild(s);
                }
            }
        }

        window.onload = init;
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            resizeConfetti();
        });
    </script>
</body>
</html>
